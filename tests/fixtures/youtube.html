<!doctype html>
<meta charset="utf-8" />
<title>Fake watch page</title>
<style>
  body {
    margin: 0;
    background: #111;
  }
  video {
    width: 640px;
    height: 360px;
  }
  /* Faithful to real players: the caption container is a layer covering the whole
     video, and the caption window inside it sits near the bottom. Positioning the
     panel from the container would put it at the top of the screen. */
  .ytp-caption-window-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  .caption-window {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 40px;
    text-align: center;
    color: #fff;
  }
</style>

<!--
  A stand-in for a YouTube watch page. It reproduces only what the content script
  depends on: a <video> element and a caption container holding one span per segment.
  It deliberately does not reproduce the rest of YouTube.
-->
<video id="player" muted playsinline></video>
<div class="ytp-caption-window-container"></div>

<script>
  // A canvas stream gives the <video> a real source, so play() resolves and
  // video.paused actually reflects playback state.
  const video = document.getElementById("player");
  const canvas = document.createElement("canvas");
  canvas.width = 640;
  canvas.height = 360;
  canvas.getContext("2d").fillRect(0, 0, 640, 360);
  video.srcObject = canvas.captureStream(30);

  const container = document.querySelector(".ytp-caption-window-container");

  // Mirrors how YouTube renders a caption: a window div with one segment span per
  // visual line, replaced wholesale on every new subtitle.
  window.showCaption = (segments) => {
    container.innerHTML = "";
    const win = document.createElement("div");
    win.className = "caption-window";
    const text = document.createElement("span");
    text.className = "captions-text";
    for (const segment of segments) {
      const line = document.createElement("span");
      line.className = "caption-visual-line";
      const span = document.createElement("span");
      span.className = "ytp-caption-segment";
      span.textContent = segment;
      line.appendChild(span);
      text.appendChild(line);
    }
    win.appendChild(text);
    container.appendChild(win);
  };

  window.clearCaption = () => {
    container.innerHTML = "";
  };
</script>
